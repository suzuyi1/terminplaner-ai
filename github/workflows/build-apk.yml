name: Build Lernplaner APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          if [ ! -f lernplaner-android.zip ]; then
            echo "Missing lernplaner-android.zip"
            exit 1
          fi
          unzip -oq lernplaner-android.zip -d .
          ls -la
          ls -la lernplaner-android
          test -f lernplaner-android/gradlew

      - name: Build debug APK
        working-directory: lernplaner-android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          ls -l app/build/outputs/apk/debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lernplaner-debug-apk
          path: lernplaner-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
